<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processed Video - Object Tracking</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: #fff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 700px;
            width: 100%;
        }
        .success-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #e8f5e9;
            color: #2e7d32;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 15px;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #333;
        }
        .video-container {
            position: relative;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        video {
            width: 100%;
            display: block;
            border-radius: 12px;
        }
        .button-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        .btn-secondary {
            background: #f5f5f5;
            color: #333;
        }
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        .btn-success {
            background: linear-gradient(135deg, #43a047 0%, #2e7d32 100%);
            color: white;
        }
        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(67, 160, 71, 0.4);
        }
        .info-section {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
        .info-title {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
        }
        .info-features {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
        }
        .info-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: #666;
        }
        .info-icon {
            font-size: 16px;
        }
        /* Copy notification */
        .copy-notification {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #333;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            opacity: 0;
            transition: all 0.3s ease;
        }
        .copy-notification.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="success-badge">
            <span>✅</span>
            <span>Processing Complete</span>
        </div>
        
        <h1>Your Tracked Video</h1>
        
        <div class="video-container">
            <video controls autoplay muted>
                <source src="{{ processed_video }}" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>
        
        <div class="button-group">
            <a href="{{ processed_video }}" class="btn btn-success" download>
                <span>⬇️</span>
                <span>Download Video</span>
            </a>
            <button class="btn btn-primary" onclick="copyLink()">
                <span>🔗</span>
                <span>Copy Link</span>
            </button>
            <a href="/" class="btn btn-secondary">
                <span>🏠</span>
                <span>Process Another</span>
            </a>
        </div>
        
        <div class="info-section">
            <p class="info-title">What was applied to your video:</p>
            <div class="info-features">
                <div class="info-item">
                    <span class="info-icon">🎯</span>
                    <span>YOLOv8 Detection</span>
                </div>
                <div class="info-item">
                    <span class="info-icon">🔄</span>
                    <span>DeepSORT Tracking</span>
                </div>
                <div class="info-item">
                    <span class="info-icon">🏷️</span>
                    <span>Unique Object IDs</span>
                </div>
                <div class="info-item">
                    <span class="info-icon">🎵</span>
                    <span>Audio Preserved</span>
                </div>
            </div>
        </div>
    </div>
    
    <div class="copy-notification" id="copyNotification">
        Link copied to clipboard!
    </div>

    <script>
        function copyLink() {
            const videoUrl = window.location.origin + '{{ processed_video }}';
            navigator.clipboard.writeText(videoUrl).then(() => {
                const notification = document.getElementById('copyNotification');
                notification.classList.add('show');
                setTimeout(() => {
                    notification.classList.remove('show');
                }, 2000);
            }).catch(err => {
                console.error('Failed to copy:', err);
                // Fallback for older browsers
                const textArea = document.createElement('textarea');
                textArea.value = videoUrl;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
            });
        }
    </script>
</body>
</html>
